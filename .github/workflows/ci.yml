name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:architecture
      - run: pnpm lint:skills
      - run: pnpm lint:issue docs/templates/github-issue.md
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integration tests (Firestore Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Firestore Emulator
        run: pnpm dev:infra
      - run: pnpm test:integration
      - name: Stop Firestore Emulator
        if: always()
        run: docker compose down --volumes

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build web image
        run: docker build --file apps/web/Dockerfile --tag job-scout-web:ci .
      - name: Build worker image
        run: docker build --file apps/worker/Dockerfile --tag job-scout-worker:ci .
      - name: Build Firestore Emulator image
        run: docker compose build firestore-emulator
      - name: Smoke-test worker against an isolated Firestore Emulator
        timeout-minutes: 3
        run: sh scripts/smoke-worker.sh job-scout-worker:ci job-scout-firestore-emulator:local
      - name: Smoke-test web image
        run: |
          docker run --detach --name web -p 127.0.0.1:8080:8080 \
            -e GOOGLE_CLOUD_PROJECT=job-scout-ci \
            -e JOBSCOUT_AI_MAX_REQUESTS_PER_RUN=1 \
            -e JOBSCOUT_AI_MAX_TOKENS_PER_RUN=1 \
            job-scout-web:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/health; then exit 0; fi
            sleep 1
          done
          docker logs web
          exit 1
      - name: Verify production refuses emulator settings
        run: |
          if docker run --rm -e GOOGLE_CLOUD_PROJECT=job-scout-ci \
            -e FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 job-scout-worker:ci; then
            echo "Worker unexpectedly started with emulator settings in production" >&2
            exit 1
          fi

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Terraform tests (mock provider, no cloud access)
        run: terraform test
